name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend, no Azure credentials needed)
        run: terraform init -backend=false -input=false
        working-directory: environments/prod

      - name: Validate
        run: terraform validate
        working-directory: environments/prod

      - name: Test (mock provider, offline)
        run: terraform test
        working-directory: environments/prod

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  security:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true   # report findings without failing the build
